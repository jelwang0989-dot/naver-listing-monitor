name: Naver Real Estate Daily Monitor

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시 실행 (KST 09:00 = UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 언제든 수동으로 즉시 실행 가능

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome & Xvfb (Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb libxi6 libgconf-2-4 libnss3
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/googlechrome-linux-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome-linux-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Real Estate Monitor with Virtual Display
        run: |
          # xvfb-run을 통해 가상 화면(1920x1080)을 제공하여 네이버 부동산의 Headless 탐지(404 에러)를 완전 우회
          xvfb-run --server-args="-screen 0 1920x1080x24" python monitor.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add current_listings.json known_listings.json new_listings.json
          if git diff --staged --quiet; then
            echo "No listing changes detected to commit."
          else
            git commit -m "Auto: Update real estate listings [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
